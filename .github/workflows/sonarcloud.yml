name: SonarQube Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analysis:
    name: Build, Test and SonarQube Analysis
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar el código
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # 3. Dar permisos al Maven Wrapper
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # 4. Ejecutar pruebas + generar cobertura JaCoCo
      - name: Build and test with coverage
        run: ./mvnw clean verify

      # 5. Verificar que JaCoCo generó el XML
      - name: Verify JaCoCo report
        run: |
          echo "Checking JaCoCo report..."
          ls -la target/site/jacoco/
          test -f target/site/jacoco/jacoco.xml

      # 6. Ejecutar análisis SonarQube
      - name: SonarQube Analysis
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=andruw159_EAP07-banco-digital-backend
            -Dsonar.organization=andruw159
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
